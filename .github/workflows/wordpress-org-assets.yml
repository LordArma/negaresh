name: wordpress.org listing

# Updates only the readme and the listing assets (.wordpress-org/) on wordpress.org between
# releases. Does nothing until the SVN_USERNAME / SVN_PASSWORD secrets exist.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.wordpress-org/**'
      - 'wp-content/plugins/negaresh/readme.txt'

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Is wordpress.org set up?
        id: gate
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        run: |
          if [ -n "$SVN_USERNAME" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "::notice::wordpress.org listing update skipped: no SVN secrets yet."; fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'

      # The action reads the readme from the repository root and would compare the whole
      # repository with SVN trunk (BUILD_DIR is not supported): copy the readme up and only
      # deploy the readme and the assets. Plugin code goes to wordpress.org with releases.
      - name: Put the readme where the action looks
        if: steps.gate.outputs.enabled == 'true'
        run: cp wp-content/plugins/negaresh/readme.txt readme.txt

      - name: Update readme and assets
        if: steps.gate.outputs.enabled == 'true'
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: negaresh
          ASSETS_DIR: .wordpress-org
          README_NAME: readme.txt
          IGNORE_OTHER_FILES: true

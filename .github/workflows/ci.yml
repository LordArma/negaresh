name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dev dependencies
        # The lock file is resolved for PHP 7.4 (composer.json config.platform) and works on 8.x.
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Syntax
        run: |
          out="$(composer lint)"; echo "$out"
          ! grep -q "Parse error" <<<"$out"

      - name: Coding standards
        run: composer cs

      - name: Static analysis
        run: composer stan

      - name: Unit tests
        run: composer test

  e2e:
    name: WordPress ${{ matrix.wp }} end to end
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: 'latest'
            image: 'wordpress:php8.3-apache'
            browser: '1'
          - wp: '5.8 (minimum)'
            image: 'wordpress:5.8-php7.4-apache'
            browser: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/e2e/run.sh
        env:
          WP_IMAGE: ${{ matrix.image }}
          BROWSER: ${{ matrix.browser }}
        run: tests/e2e/run.sh

  package:
    name: Plugin zip
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build the zip exactly as a release would
        run: |
          bin/build-zip.sh HEAD build/negaresh.zip
          unzip -q build/negaresh.zip -d build/unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: negaresh
          # GitHub zips artifacts itself: uploading the negaresh/ folder gives the same layout
          # as the release zip, instead of a zip inside a zip.
          path: build/unpacked

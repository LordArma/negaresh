name: Release

# Push a tag like v4.2.0 to publish a release. The tag must match the plugin header Version,
# NEGARESH_VERSION and a dated CHANGELOG.md section; all checks must pass first.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the plugin version and the changelog
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER="$(sed -n 's/^ \* Version: //p' wp-content/plugins/negaresh/negaresh.php)"
          CONSTANT="$(sed -n "s/^define('NEGARESH_VERSION', '\(.*\)');/\1/p" wp-content/plugins/negaresh/negaresh.php)"
          echo "tag=$TAG header=$HEADER constant=$CONSTANT"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONSTANT" ]; then
            echo "Tag, plugin header Version and NEGARESH_VERSION must be the same"; exit 1
          fi
          grep -qE "^## \[$TAG\] \([0-9]{4}-[0-9]{2}-[0-9]{2}\)" CHANGELOG.md \
            || { echo "CHANGELOG.md needs a dated '## [$TAG] (YYYY-MM-DD)' section"; exit 1; }

      - uses: shivammathur/setup-php@v2
        with:
          php: '8.3'
          coverage: none
          tools: composer:v2

      - name: All checks
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          composer check

      - name: End to end in WordPress
        run: tests/e2e/run.sh

      - name: Build zip and notes
        run: |
          bin/build-zip.sh "$GITHUB_REF_NAME" build/negaresh.zip
          bin/release-notes.sh "${GITHUB_REF_NAME#v}" > build/notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/negaresh.zip \
            --title "Negaresh ${GITHUB_REF_NAME#v}" --notes-file build/notes.md --verify-tag

  wordpress-org:
    # Publishes the same build to wordpress.org's SVN once the plugin is approved there and the
    # SVN_USERNAME / SVN_PASSWORD secrets exist; until then it only leaves a notice. It is a job of
    # this workflow because a release made with GITHUB_TOKEN does not start other workflows.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Is wordpress.org set up?
        id: gate
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        run: |
          if [ -n "$SVN_USERNAME" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "::notice::wordpress.org deploy skipped: add SVN_USERNAME and SVN_PASSWORD secrets after the plugin is approved."; fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'

      - name: Build the plugin folder
        id: build
        if: steps.gate.outputs.enabled == 'true'
        run: |
          bin/build-zip.sh "$GITHUB_REF_NAME" build/negaresh.zip
          unzip -q build/negaresh.zip -d build
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Deploy to wordpress.org
        if: steps.gate.outputs.enabled == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: negaresh
          VERSION: ${{ steps.build.outputs.version }}
          BUILD_DIR: build/negaresh
          ASSETS_DIR: .wordpress-org

